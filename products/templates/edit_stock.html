{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Stock</title>

    <link rel="stylesheet" href="{% static 'style.css' %}?v=2">
</head>

<body>

<div class="container">

    <h1>✏️ Edit Stock</h1>

    <div class="product-card">

        <h2>{{ stock.product.name }}</h2>

        <form method="POST">

            {% csrf_token %}

            <label>Quantity</label>

            <input type="number"
                   name="quantity"
                   value="{{ stock.quantity }}"
                   required>

            <br><br>

            <button type="submit" class="add-btn">
                💾 Update Stock
            </button>

        </form>

        <br>

        <a href="{% url 'stock_list' %}">
            ← Back to Stock
        </a>

    </div>

</div>

</body>
</html>
