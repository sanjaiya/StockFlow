{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>

    <link rel="stylesheet" href="{% static 'style.css' %}?v=2">
</head>

<body>

<div class="container">

    <h1>✏️ Edit Product</h1>

    <div class="product-card">

        <form method="POST">

            {% csrf_token %}

            <!-- Product Name -->
            <label>Product Name</label>
            <br>
            <input type="text"
                   name="name"
                   value="{{ product.name }}"
                   required>

            <br><br>

            <!-- Category -->
            <label>Category</label>
            <br>
            <input type="text"
                   name="category"
                   value="{{ product.category }}"
                   required>

            <br><br>

            <!-- Price -->
            <label>Price</label>
            <br>
            <input type="number"
                   name="price"
                   value="{{ product.price }}"
                   step="0.01"
                   required>

            <br><br>

            <!-- Quantity -->
            <label>Quantity</label>
            <br>
            <input type="number"
                   name="quantity"
                   value="{{ product.quantity }}"
                   required>

            <br><br>

            <!-- Supplier -->
            <label>Supplier</label>
            <br>

            <select name="supplier" required>

                {% for supplier in suppliers %}

                    <option value="{{ supplier.id }}"
                        {% if supplier.id == product.supplier.id %}
                            selected
                        {% endif %}>
                        {{ supplier.name }}
                    </option>

                {% endfor %}

            </select>

            <br><br>

            <button type="submit" class="edit-btn">
                💾 Update Product
            </button>

        </form>

        <br>

        <a href="{% url 'product_list' %}">
            ← Back to Products
        </a>

    </div>

</div>

</body>
</html>
