{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Delete Stock</title>

    <link rel="stylesheet" href="{% static 'style.css' %}?v=2">
</head>

<body>

<div class="container">

    <h1>🗑️ Delete Stock</h1>

    <div class="product-card">

        <h2>{{ stock.product.name }}</h2>

        <p>
            Are you sure you want to delete this stock?
        </p>

        <p>
            📦 Quantity: {{ stock.quantity }}
        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit" class="delete-btn">
                🗑️ Delete Stock
            </button>

        </form>

        <br>

        <a href="{% url 'stock_list' %}">
            ← Cancel
        </a>

    </div>

</div>

</body>
</html>
